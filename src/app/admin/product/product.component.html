<div class="grid grid-cols-9 gap-2">
  <div class="col-span-2">
    <app-sidebar></app-sidebar>
  </div>
  <div class="col-span-7 p-5">
    <h1 class="text-center text-3xl font-bold pb-3">All Users List</h1>
    <div class="flex justify-between items-center">
      <button routerLink="/admin/product/add" class="bg-black text-white px-3 rounded py-2">
        Add New Product
        <i class="fa-solid fa-plus"></i>
      </button>
      <input
        [(ngModel)]="searchProduct"
        class="w-96 bg-transparent border rounded-xl p-2 float-end me-10"
        type="text"
        placeholder="Search Your Prdouct Name here"
      />
    </div>
    <div class="pt-2">
      <p-table
        *ngIf="(allProduct | search : searchProduct).length > 0"
        [value]="allProduct | search : searchProduct"
        [tableStyle]="{ 'min-width': '50rem' }"
      >
        <ng-template #header>
          <tr>
            <th>#</th>
            <th>Name</th>
            <th>Image</th>
            <th>Price</th>
            <th>...</th>
          </tr>
        </ng-template>
        <ng-template #body let-product let-i="rowIndex">
          <tr>
            <td>{{ i + 1 }}</td>
            <td>{{ product.title }}</td>
            <td>
              <img
                [src]="product.thumbnail"
                height="50px"
                width="50px"
                alt=""
              />
            </td>
            <td>{{ product.price }}</td>
            <td>
              <button routerLink="/admin/product/{{product._id}}/edit"><i class="fa-solid fa-pen-to-square me-3"></i></button>
              <button (click)="deleteProduct(product._id)"><i class="fa-solid fa-trash"></i></button>
            </td>
          </tr>
        </ng-template>
      </p-table>
      <div
        *ngIf="(allProduct | search : searchProduct).length == 0"
        class="text-center text-xl font-semibold text-gray-500"
      >
        No Products Found
      </div>
    </div>
  </div>
</div>
