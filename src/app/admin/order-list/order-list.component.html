<div class="grid grid-cols-9 gap-2">
  <div class="col-span-2">
    <app-sidebar></app-sidebar>
  </div>
  <div class="col-span-7 p-5">
    <h1 class="text-center text-3xl font-bold pb-3">All Users List</h1>
    <div class="card">
      <p-table
        *ngIf="allOrders.length > 0"
        [value]="allOrders"
        [tableStyle]="{ 'min-width': '50rem' }"
      >
        <ng-template #header>
          <tr>
            <th>#</th>
            <th>Name</th>
            <th>Address</th>
            <th>Phone Number</th>
            <th>Product Name</th>
            <th>Product Image</th>
            <th>Amount</th>
          </tr>
        </ng-template>
        <ng-template #body let-order let-i="rowIndex">
          <tr *ngFor="let item of order.itemDetails; let first = first">
            <td *ngIf="first" [attr.rowspan]="order.itemDetails.length">
              {{ i + 1 }}
            </td>
            <td *ngIf="first" [attr.rowspan]="order.itemDetails.length">
              {{ order.name }}
            </td>
            <td *ngIf="first" [attr.rowspan]="order.itemDetails.length">
              {{ order.address }}
            </td>
            <td *ngIf="first" [attr.rowspan]="order.itemDetails.length">
              {{ order.phonenumber }}
            </td>
            <td>{{ item.title }}</td>
            <td>
              <img height="50px" width="50px" [src]="item.thumbnail" alt="" />
            </td>
            <td *ngIf="first" [attr.rowspan]="order.itemDetails.length">
              {{ order.amount }}
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>
</div>
