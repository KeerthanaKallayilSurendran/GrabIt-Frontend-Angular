<app-header></app-header>
<div class="bg-black px-5 placeholder-sky-100 text-white min-h-screen">
  <h1 class="font-bold text-5xl text-center">
    My Wishlist <span class="text-2xl">({{ numberOfItem }})</span>
  </h1>
  <div class="flex justify-center pt-10">
    <div class="w-full md:w-3/6 shadow-lg">
      @if (wishlist.length>0) { @for (item of wishlist; track $index) {
      <div class="flex w-full items-center">
        <div class="w-1/3">
          <img height="250px" width="250px" [src]="item.thumbnail" alt="" />
        </div>
        <div class="w-2/3 ps-5">
          <h4 class="text-2xl font-bold">{{ item.title }}</h4>
          <p class="text-lg font-semibold">{{ item.price }}</p>
        </div>
        <div class="w-1/3 text-right pe-5">
          <button (click)="removeFromWishlist(item._id)">
            <i class="fa-solid fa-trash"></i>
          </button>
        </div>
      </div>
      <hr class="border-2" />
      } }@else {
      <h3 class="text-center text-3xl text-red-700 p-10">Wishlist is Empty</h3>
      }
    </div>
  </div>
</div>
<app-footer></app-footer>
