<app-header></app-header>
<div class="md:h-svh bg-black w-full pt-5">
  <h1 class="text-white text-4xl font-bold text-center pb-3">Cart</h1>
  @if (cart.length>0) {
  <div class="w-full flex text-white">
    <div class="md:block hidden w-1/6"></div>
    <div class="w-2/6 me-1">
      @if(cart.length>0){ @for (item of cart; track $index) {
      <div class="flex items-center">
        <img height="150px" width="150px" [src]="item.thumbnail" alt="" />
        <div class="ps-3">
          <h1 class="text-2xl font-bold pb-2">{{ item.title }}</h1>
          <p class="text-lg">₹{{ item.price }}</p>
        </div>
      </div>
      <div class="flex pb-3 ps-2">
        <div>
          <button (click)="decrementCount(item)" class="text-xl font-bold pe-2">
            -
          </button>
          <input
            readonly
            [value]="item.count"
            class="w-10 h-10 bg-transparent border rounded-md text-center font-bold text-lg"
            type="text"
          />
          <button (click)="incrementCount(item)" class="text-xl font-bold ps-2">
            +
          </button>
        </div>
        <button (click)="addToWishlist(item._id, item)" class="ps-3">
          SAVE FOR LATER
        </button>
        <button (click)="removeProductFromCart(item._id)" class="ps-3">
          REMOVE
        </button>
      </div>
      <hr />
      } }@else { }
      <button
        routerLink="/all-products"
        class="float-start px-4 py-2 bg-[#ae9b8438] text-lg font-bold m-3"
      >
        Shop More
      </button>
      <button
        (click)="emptyCart()"
        class="float-end px-4 py-2 bg-[#ae9b8438] text-lg font-bold m-3"
      >
        Empty Cart
      </button>
    </div>
    <div class="w-2/6 bg-gray-900 p-5 rounded">
      <h1 class="text-xl font-bold">Price Details</h1>
      <div>
        <div class="flex items-center justify-between pt-5">
          <h4 class="text-xl">Total Amount ({{ numberOfItems }} Items):</h4>
          <p class="font-bold text-xl">₹{{ totalPrice }}</p>
        </div>
        <button
          class="float-end px-4 py-2 bg-[#ae9b8438] text-xl font-bold m-3"
          (click)="toPlaceOrder()"
        >
          Place Order
        </button>
      </div>
    </div>
    <div class="md:block hidden w-1/6"></div>
  </div>
  }@else {
  <div class="flex flex-col justify-center items-center">
    <h1 class="text-center text-2xl font-bold text-red-700 pt-5">
      Your Cart is Empty
    </h1>
    <img
      class="md:w-2/6 w-3/6"
      src="https://static.vecteezy.com/system/resources/previews/024/679/917/original/empty-shopping-cart-3d-illustration-icon-png.png"
      alt=""
    />
  </div>
  }
</div>
<app-footer></app-footer>
